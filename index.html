<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142d4e">
<title>نيو ستار | إدارة مصنع الملابس</title>
<style>
:root{--navy:#142d4e;--blue:#2864dc;--bg:#f3f6fb;--ink:#17263c;--muted:#718096;--line:#e4eaf2;--green:#16845b;--red:#c34444}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:var(--navy);color:white;padding:24px 14px}.brand{font-size:20px;font-weight:800;padding:4px 10px 24px}.brand small{display:block;color:#b9c8dc;font-size:12px;font-weight:400;margin-top:8px}.nav{display:grid;gap:6px}.nav button{border:0;color:#d8e3f3;background:transparent;text-align:right;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#29486c;color:white}.side-note{font-size:11px;color:#afc0d7;line-height:1.8;margin:28px 10px}.main{min-width:0}.top{background:white;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:21px;margin:0}.top p{color:var(--muted);font-size:12px;margin:7px 0 0}.pill{background:#eaf7f0;color:var(--green);padding:7px 10px;border-radius:20px;font-size:12px;white-space:nowrap}.content{padding:24px;max-width:1500px;margin:auto}.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.headrow h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:700}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.stat .label{font-size:12px;color:var(--muted)}.stat .num{font-size:25px;font-weight:800;margin:12px 0 7px}.stat .hint{font-size:11px;color:var(--muted)}.layout2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel h3{font-size:15px;margin:0 0 16px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--muted);font-weight:600;background:#fafbfd}tr:last-child td{border-bottom:0}.status{padding:5px 8px;border-radius:20px;font-size:11px;background:#fff4df;color:#9b620e}.status.done{background:#e7f7ef;color:#14764e}.status.work{background:#eaf1ff;color:#2857ae}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick button{border:1px solid var(--line);background:#fbfcff;border-radius:10px;padding:14px;text-align:right;color:var(--ink)}.quick strong{display:block;margin-bottom:6px}.quick span{font-size:11px;color:var(--muted)}.barrow{margin:15px 0}.barlabel{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.bar{height:8px;background:#edf1f7;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:20px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:7px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;padding:11px;border:1px solid #d9e1ec;border-radius:9px;background:white;color:var(--ink)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.empty{padding:24px;text-align:center;color:var(--muted)}.notice{background:#eef5ff;border:1px solid #d8e7ff;padding:12px;border-radius:10px;font-size:12px;line-height:1.8;margin-bottom:16px}.hidden{display:none!important}.mobile-menu{display:none}.small{font-size:11px;color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.side.open{display:block;position:absolute;z-index:5;width:245px;min-height:100vh;box-shadow:0 0 0 100vmax #0c1c2e66}.mobile-menu{display:inline-block}.top{padding:15px 16px}.content{padding:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout2{grid-template-columns:1fr}}@media(max-width:480px){.stats{gap:9px}.stat{padding:13px}.stat .num{font-size:21px}.formgrid{grid-template-columns:1fr}.top h1{font-size:17px}.pill{font-size:10px}}@media print{.side,.btn,.mobile-menu{display:none!important}.app{display:block}.content{padding:0}.top{border:0}}
</style></head>
<body><div class="app"><aside class="side" id="sidebar"><div class="brand">✂ نيو ستار <small>نظام إدارة مصنع الملابس</small></div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦　لوحة التحكم</button><button data-page="orders">▤　الطلبيات والإنتاج</button><button data-page="inventory">▣　المخازن والخامات</button><button data-page="workers">♙　العمال والأجور</button><button data-page="customers">♧　العملاء</button><button data-page="expenses">▧　المصروفات والتكلفة</button><button data-page="reports">▥　التقارير</button></nav><div class="side-note">نسخة أولية للتجربة<br>البيانات تحفظ على نفس الجهاز والمتصفح.</div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:10px"><button class="btn secondary mobile-menu" id="menuBtn">☰</button><div><h1 id="pageTitle">لوحة التحكم</h1><p>إدارة التشغيل والمخازن والحسابات في مكان واحد</p></div></div><span class="pill">● النظام يعمل محليًا</span></header><section class="content" id="content"></section></main></div>
<div id="modal" class="hidden" style="position:fixed;inset:0;background:#0b1b2c88;z-index:10;place-items:center;padding:15px"><div class="panel" style="width:min(560px,100%);max-height:90vh;overflow:auto"><div class="headrow"><h2 id="modalTitle">إضافة</h2><button class="btn secondary" id="closeModal">إغلاق ✕</button></div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s),money=n=>Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
const initial={orders:[{id:'NS-1001',customer:'الصفوة للملابس',product:'تيشيرت قطن',qty:1200,price:95,status:'جاري التشغيل',due:'2026-11-05'},{id:'NS-1002',customer:'مؤسسة الأمل',product:'بنطلون أطفال',qty:650,price:120,status:'قيد التجهيز',due:'2026-11-12'},{id:'NS-1003',customer:'بيع لحساب المصنع',product:'تريننج رياضي',qty:400,price:160,status:'تم التسليم',due:'2026-10-18'}],inventory:[{name:'قماش قطن',unit:'متر',qty:850,min:200,cost:48},{name:'سوستة 20 سم',unit:'قطعة',qty:1200,min:300,cost:4.5},{name:'خيط بوليستر',unit:'بكرة',qty:75,min:25,cost:32}],workers:[{name:'محمد السيد',type:'داخل المصنع',wage:'يومية',rate:250,days:24},{name:'أحمد علي',type:'تشغيل خارجي',wage:'بالقطعة',rate:8,days:300},{name:'سعيد حسن',type:'داخل المصنع',wage:'راتب شهري',rate:6500,days:1}],customers:[{name:'الصفوة للملابس',phone:'01000000001',balance:12500},{name:'مؤسسة الأمل',phone:'01000000002',balance:7800}],expenses:[{name:'كهرباء المصنع',category:'مرافق',amount:4200,date:'2026-10-05'},{name:'صيانة ماكينة',category:'صيانة',amount:1800,date:'2026-10-12'}]};
let db;try{db=JSON.parse(localStorage.getItem('newstar_data'))||JSON.parse(JSON.stringify(initial))}catch(e){db=JSON.parse(JSON.stringify(initial))}let page='dashboard';
function save(){localStorage.setItem('newstar_data',JSON.stringify(db))}function navTo(p){page=p;$('#sidebar').classList.remove('open');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)navTo(b.dataset.page)});$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
const titles={dashboard:'لوحة التحكم',orders:'الطلبيات والإنتاج',inventory:'المخازن والخامات',workers:'العمال والأجور',customers:'العملاء',expenses:'المصروفات والتكلفة',reports:'التقارير'};
function stat(label,num,hint){return '<div class="stat"><div class="label">'+label+'</div><div class="num">'+num+'</div><div class="hint">'+hint+'</div></div>'}function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+headers.length+'" class="empty">لا توجد بيانات حتى الآن</td></tr>')+'</tbody></table></div>'}function status(s){return '<span class="status '+(s==='تم التسليم'?'done':s==='جاري التشغيل'?'work':'')+'">'+s+'</span>'}
function render(){ $('#pageTitle').textContent=titles[page];let el=$('#content');if(page==='dashboard'){let active=db.orders.filter(o=>o.status!=='تم التسليم'),low=db.inventory.filter(i=>Number(i.qty)<=Number(i.min));el.innerHTML='<div class="headrow"><div><h2>ملخص المصنع</h2><div class="muted">نظرة سريعة على حالة التشغيل اليوم</div></div><button class="btn" onclick="openForm(\\'orders\\')">＋ طلبية جديدة</button></div><div class="stats">'+stat('إجمالي الطلبيات',db.orders.length,'كل الطلبيات المسجلة')+stat('طلبيات تحت التشغيل',active.length,'لم يتم تسليمها بعد')+stat('عدد العمال',db.workers.length,'عمال داخليون وتشغيل خارجي')+stat('تنبيهات المخزون',low.length,'أصناف وصلت للحد الأدنى')+'</div><div class="layout2"><div class="panel"><h3>آخر الطلبيات</h3>'+table(['رقم الطلبية','العميل','المنتج','الكمية','الحالة'],db.orders.slice(0,5).map(o=>'<tr><td>'+o.id+'</td><td>'+o.customer+'</td><td>'+o.product+'</td><td>'+money(o.qty)+'</td><td>'+status(o.status)+'</td></tr>'))+'</div><div class="panel"><h3>اختصارات سريعة</h3><div class="quick"><button onclick="openForm(\\'orders\\')"><strong>＋ طلبية</strong><span>تسجيل طلب إنتاج جديد</span></button><button onclick="openForm(\\'inventory\\')"><strong>＋ خامة</strong><span>إضافة صنف للمخزن</span></button><button onclick="openForm(\\'workers\\')"><strong>＋ عامل</strong><span>تسجيل بيانات وأجر</span></button><button onclick="openForm(\\'expenses\\')"><strong>＋ مصروف</strong><span>تسجيل مصروف مصنع</span></button></div><h3 style="margin-top:22px">حالة المخزون</h3>'+db.inventory.slice(0,4).map(i=>'<div class="barrow"><div class="barlabel"><span>'+i.name+'</span><span>'+i.qty+' '+i.unit+'</span></div><div class="bar"><i style="width:'+Math.max(4,Math.min(100,i.qty/Math.max(i.min*3,1)*100))+'%"></i></div></div>').join('')+'</div></div><div class="notice" style="margin-top:16px">مهم: هذه نسخة أولية ببيانات تجريبية. احذف البيانات التجريبية وأدخل بيانات مصنعك قبل الاعتماد عليها. البيانات محفوظة داخل المتصفح الحالي فقط وليست قاعدة بيانات مشتركة بين الأجهزة.</div>';return}
if(page==='orders'){el.innerHTML=head('الطلبيات والإنتاج','متابعة طلبات العملاء والتصنيع لحساب المصنع','orders')+table(['رقم الطلبية','العميل','المنتج','الكمية','سعر الوحدة','القيمة التقديرية','التسليم','الحالة','إجراء'],db.orders.map((o,i)=>'<tr><td>'+o.id+'</td><td>'+o.customer+'</td><td>'+o.product+'</td><td>'+money(o.qty)+'</td><td>'+money(o.price)+'</td><td>'+money(o.qty*o.price)+'</td><td>'+o.due+'</td><td><select onchange="changeStatus('+i+',this.value)" style="border:1px solid #ddd;padding:6px;border-radius:7px">'+['قيد التجهيز','جاري التشغيل','تم التسليم','متوقف'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><button class="btn danger" onclick="removeItem(\\'orders\\','+i+')">حذف</button></td></tr>'))+'<p class="small">القيمة تقديرية حسب سعر الوحدة المدخل، وليست التكلفة الفعلية النهائية.</p>';return}
if(page==='inventory'){el.innerHTML=head('المخازن والخامات','رصيد الخامات والحد الأدنى للتنبيه','inventory')+table(['الصنف','الوحدة','الرصيد','حد التنبيه','تكلفة الوحدة','قيمة المخزون','الحالة','إجراء'],db.inventory.map((x,i)=>'<tr><td>'+x.name+'</td><td>'+x.unit+'</td><td>'+x.qty+'</td><td>'+x.min+'</td><td>'+money(x.cost)+'</td><td>'+money(x.qty*x.cost)+'</td><td>'+(x.qty<=x.min?'<span class="status">مطلوب شراء</span>':'<span class="status done">متاح</span>')+'</td><td><button class="btn danger" onclick="removeItem(\\'inventory\\','+i+')">حذف</button></td></tr>'));return}
if(page==='workers'){el.innerHTML=head('العمال والأجور','أجور يومية أو شهرية مع إمكانية تسجيل التشغيل الخارجي','workers')+table(['اسم العامل/المتعهد','نوع التشغيل','نظام الأجر','قيمة الأجر','أيام/كمية','المستحق التقديري','إجراء'],db.workers.map((w,i)=>'<tr><td>'+w.name+'</td><td>'+w.type+'</td><td>'+w.wage+'</td><td>'+money(w.rate)+'</td><td>'+w.days+'</td><td>'+money(w.rate*w.days)+'</td><td><button class="btn danger" onclick="removeItem(\\'workers\\','+i+')">حذف</button></td></tr>'))+'<p class="small">المستحق التقديري = قيمة الأجر × الأيام أو الكمية. راجع طريقة الحساب لكل نوع تشغيل قبل اعتماد كشوف الأجور.</p>';return}
if(page==='customers'){el.innerHTML=head('العملاء','بيانات العملاء والأرصدة المسجلة','customers')+table(['اسم العميل','الهاتف','الرصيد المستحق','إجراء'],db.customers.map((c,i)=>'<tr><td>'+c.name+'</td><td>'+c.phone+'</td><td>'+money(c.balance)+'</td><td><button class="btn danger" onclick="removeItem(\\'customers\\','+i+')">حذف</button></td></tr>'));return}
if(page==='expenses'){el.innerHTML=head('المصروفات والتكلفة','تسجيل المصروفات المباشرة وغير المباشرة','expenses')+'<div class="stats">'+stat('إجمالي المصروفات',money(db.expenses.reduce((a,x)=>a+Number(x.amount),0)),'المصروفات المسجلة')+stat('عدد القيود',db.expenses.length,'عدد المصروفات')+'</div>'+table(['البيان','التصنيف','المبلغ','التاريخ','إجراء'],db.expenses.map((x,i)=>'<tr><td>'+x.name+'</td><td>'+x.category+'</td><td>'+money(x.amount)+'</td><td>'+x.date+'</td><td><button class="btn danger" onclick="removeItem(\\'expenses\\','+i+')">حذف</button></td></tr>'))+'<div class="notice">التكلفة الفعلية للطلبية ستحتاج ربط صرف الخامات وأجور التشغيل والمصاريف بكل أمر إنتاج، ثم احتساب تكلفة القطعة بعد إتمام التشغيل.</div>';return}
if(page==='reports'){el.innerHTML='<div class="headrow"><div><h2>التقارير</h2><div class="muted">ملخص قابل للطباعة للبيانات الحالية</div></div><button class="btn" onclick="window.print()">طباعة التقرير</button></div><div class="stats">'+stat('قيمة الطلبيات التقديرية',money(db.orders.reduce((a,o)=>a+o.qty*o.price,0)),'الكمية × سعر الوحدة')+stat('قيمة المخزون',money(db.inventory.reduce((a,x)=>a+x.qty*x.cost,0)),'الرصيد × تكلفة الوحدة')+stat('مستحقات العمال التقديرية',money(db.workers.reduce((a,w)=>a+w.rate*w.days,0)),'حسب البيانات المدخلة')+stat('إجمالي المصروفات',money(db.expenses.reduce((a,x)=>a+Number(x.amount),0)),'المصروفات المسجلة')+'</div><div class="panel"><h3>نسخة احتياطية</h3><p class="muted">احفظ نسخة من البيانات الحالية في ملف JSON.</p><button class="btn" onclick="backup()">تنزيل نسخة البيانات</button> <button class="btn secondary" onclick="document.getElementById(\\'restoreFile\\').click()">استيراد نسخة</button><input id="restoreFile" type="file" accept=".json,application/json" class="hidden" onchange="restore(event)"></div><div class="notice" style="margin-top:16px">التقارير الحالية أولية ولا تمثل دفتر حسابات متكاملًا أو قوائم مالية معتمدة.</div>';return}}
function head(t,d,k){return '<div class="headrow"><div><h2>'+t+'</h2><div class="muted">'+d+'</div></div><button class="btn" onclick="openForm(\\''+k+'\\')">＋ إضافة جديد</button></div>'}
function openForm(type){const fields={orders:[['customer','اسم العميل/جهة التشغيل','text'],['product','اسم المنتج','text'],['qty','الكمية','number'],['price','سعر الوحدة التقديري بالجنيه','number'],['due','موعد التسليم','date'],['status','الحالة','select:قيد التجهيز|جاري التشغيل|تم التسليم|متوقف']],inventory:[['name','اسم الخامة/الصنف','text'],['unit','وحدة القياس','text'],['qty','الرصيد الحالي','number'],['min','حد التنبيه','number'],['cost','تكلفة الوحدة بالجنيه','number']],workers:[['name','اسم العامل أو المتعهد','text'],['type','نوع التشغيل','select:داخل المصنع|تشغيل خارجي'],['wage','نظام الأجر','select:يومية|راتب شهري|بالقطعة'],['rate','قيمة الأجر بالجنيه','number'],['days','عدد الأيام أو القطع','number']],customers:[['name','اسم العميل','text'],['phone','رقم الهاتف','tel'],['balance','الرصيد المستحق بالجنيه','number']],expenses:[['name','بيان المصروف','text'],['category','التصنيف','select:خامات|أجور|مرافق|صيانة|نقل|إيجار|أخرى'],['amount','المبلغ بالجنيه','number'],['date','التاريخ','date']]};$('#modalTitle').textContent='إضافة '+({orders:'طلبية إنتاج',inventory:'صنف مخزن',workers:'عامل/متعهد',customers:'عميل',expenses:'مصروف'}[type]);$('#modalBody').innerHTML='<form id="entryForm"><div class="formgrid">'+fields[type].map(([k,l,t])=>'<div class="field"><label>'+l+'</label>'+(t.startsWith('select:')?'<select name="'+k+'" required>'+t.slice(7).split('|').map(v=>'<option>'+v+'</option>').join('')+'</select>':'<input name="'+k+'" type="'+t+'" '+(['qty','price','min','cost','rate','days','balance','amount'].includes(k)?'min="0" step="any"':'')+' required>')+'</div>').join('')+'</div><div class="actions"><button class="btn" type="submit">حفظ البيانات</button><button class="btn secondary" type="button" onclick="closeModal()">إلغاء</button></div></form>';$('#modal').classList.remove('hidden');$('#modal').style.display='grid';$('#entryForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());for(let k of ['qty','price','min','cost','rate','days','balance','amount'])if(data[k]!==undefined)data[k]=Number(data[k]);if(type==='orders')data.id='NS-'+(1001+Date.now()%8998);db[type].unshift(data);save();closeModal();render()}}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').style.display='none'}$('#closeModal').onclick=closeModal;
function removeItem(type,i){if(confirm('هل تريد حذف هذا السجل؟')){db[type].splice(i,1);save();render()}}function changeStatus(i,s){db.orders[i].status=s;save();render()}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='new-star-backup.json';a.click();URL.revokeObjectURL(u)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.orders||!x.inventory||!x.workers)throw Error();db=x;save();render();alert('تم استيراد البيانات')}catch(err){alert('ملف النسخة غير صالح')}};r.readAsText(f)}render();
</script></body></html>
